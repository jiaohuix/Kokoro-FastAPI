version: '3.8'

services:
  kokoro-gpu:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kokoro-gpu
    restart: always
    ports:
      - "8001:8880"
    volumes:
      - ./api:/app/api
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    tty: true
    stdin_open: true
